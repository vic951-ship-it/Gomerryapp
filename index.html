<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gomerry Shop</title>
<style>
body{font-family:Arial;margin:0;background:#f0fdf4}
.header{background:#16a34a;color:white;padding:15px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card button{background:#16a34a;color:white;border:none;padding:8px 15px;border-radius:20px;width:90%;font-weight:bold}
.cart{background:white;margin:10px;border-radius:12px;padding:15px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.paybtn{background:#16a34a;color:white;border:none;padding:15px;width:100%;border-radius:8px;font-size:16px;font-weight:bold}
.msg{padding:12px;border-radius:8px;margin-top:10px;text-align:center;font-weight:bold}
.err{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
</style></head><body>
<div class="header"><h2 style="margin:0">Gomerry Shop</h2><div>Till 4835569 - Lipa Na M-Pesa</div></div>
<div class="grid">
<div class="card"><div style="font-size:40px">🧂</div><b>Sugar 1kg</b><br>KES 180<br><button onclick="add('Sugar 1kg',180)">Add</button></div>
<div class="card"><div style="font-size:40px">🫒</div><b>Oil 1L</b><br>KES 320<br><button onclick="add('Oil 1L',320)">Add</button></div>
<div class="card"><div style="font-size:40px">🍚</div><b>Rice 2kg</b><br>KES 280<br><button onclick="add('Rice 2kg',280)">Add</button></div>
<div class="card"><div style="font-size:40px">🌽</div><b>Flour 2kg</b><br>KES 160<br><button onclick="add('Flour 2kg',160)">Add</button></div>
</div>
<div class="cart">
<div id="cartTitle"><b>Cart (0)</b></div>
<div id="cartItems">No items</div>
<h3 id="total">Total: KES 0</h3><hr>
<b>Pay with M-Pesa</b>
<input id="cname" placeholder="Your Name" value="Victor kiragu">
<input id="cphone" placeholder="Phone 07..." value="0718370199">
<button class="paybtn" onclick="pay()">Pay Now via M-Pesa</button>
<div id="msg"></div>
</div>
<script>
let cart=[];
function add(name,price){cart.push({name,price});render()}
function render(){
 let t=0,html='';
 cart.forEach((i,idx)=>{t+=i.price;html+=`${i.name} - ${i.price} <span style="color:red;cursor:pointer" onclick="cart.splice(${idx},1);render()"> x</span><br>`});
 document.getElementById('cartTitle').innerHTML=`<b>Cart (${cart.length})</b>`;
 document.getElementById('cartItems').innerHTML=cart.length?html:'No items';
 document.getElementById('total').innerText=`Total: KES ${t}`;
}
async function pay(){
 if(!cart.length){alert('Add item first');return}
 let total=cart.reduce((s,i)=>s+i.price,0);
 let phone=document.getElementById('cphone').value;
 let name=document.getElementById('cname').value;
 let m=document.getElementById('msg');
 m.innerHTML='⏳ Sending STK... Please wait';
 m.className='msg';
 try{
  let r=await fetch('/api/mpesa/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount:total,name})});
  let d=await r.json();
  console.log(d);
  if(d.success){
   m.innerHTML='✅ STK Sent! Check phone '+phone+' and enter PIN';
   m.className='msg ok';
  } else {
   let err = d.message || d.error?.errorMessage || d.error?.errorCode || JSON.stringify(d.error);
   m.innerHTML='❌ Failed: '+ err;
   m.className='msg err';
  }
 }catch(e){
  m.innerHTML='❌ Network Error: '+e.message;
  m.className='msg err';
 }
}
</script></body></html>
