<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gomerry - Till 4835569</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f2fef5}
header{background:#00a651;color:#fff;padding:18px;text-align:center;position:sticky;top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 6px #0001}
.card div{font-size:36px}
.card button{width:100%;margin-top:8px;background:#00a651;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:bold}
.cart{margin:12px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
#payBtn{width:100%;background:#00a651;color:#fff;border:none;padding:16px;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
#payBtn:disabled{background:#999}
#status{margin-top:10px;padding:12px;border-radius:8px;display:none;text-align:center;font-weight:bold}
.item{display:flex;justify-content:space-between;margin:4px 0}
</style>
</head>
<body>
<header>
<h2>Gomerry Shop</h2>
<p>Till 4835569 - Lipa Na M-Pesa</p>
</header>

<div class="grid" id="grid"></div>

<div class="cart">
<h3>Cart (<span id="count">0</span>)</h3>
<div id="items">Empty</div>
<h3 style="margin-top:10px">Total: KES <span id="total">0</span></h3>

<hr style="margin:14px 0">

<h3>Pay with M-Pesa</h3>
<input id="name" placeholder="Your Name" />
<input id="phone" type="tel" placeholder="07XXXXXXXX" />

<button id="payBtn" onclick="pay()">Pay Now via M-Pesa</button>
<div id="status"></div>
</div>

<script>
const prods=[
{name:"Milk 500ml",price:60,icon:"🥛"},
{name:"Bread",price:70,icon:"🍞"},
{name:"Sugar 1kg",price:180,icon:"🧂"},
{name:"Oil 1L",price:320,icon:"🫒"},
{name:"Rice 2kg",price:280,icon:"🍚"},
{name:"Flour 2kg",price:160,icon:"🌽"},
];
let cart=[];
const grid=document.getElementById("grid");
prods.forEach((p,i)=>{
grid.innerHTML+=`<div class="card"><div>${p.icon}</div><b>${p.name}</b><p>KES ${p.price}</p><button onclick="add(${i})">Add</button></div>`;
});

function add(i){cart.push(prods[i]);draw();}
function del(i){cart.splice(i,1);draw();}
function draw(){
let t=0;let h="";
cart.forEach((c,i)=>{t+=c.price;h+=`<div class="item"><span>${c.name}</span><span>${c.price} <a onclick="del(${i})" style="color:red">x</a></span></div>`;});
document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=t;
document.getElementById("items").innerHTML=h||"Empty";
}

async function pay(){
const phone=document.getElementById("phone").value.trim();
const name=document.getElementById("name").value.trim()||"Customer";
const total=Number(document.getElementById("total").innerText)||0;
const btn=document.getElementById("payBtn");
const st=document.getElementById("status");

if(cart.length==0){alert("Add items first");return;}
if(phone.length<10){alert("Enter 07... number");return;}

btn.disabled=true;
btn.innerText="⏳ Sending STK...";
st.style.display="block";
st.style.background="#fff3cd";
st.innerText="Sending STK to "+phone+" ...";

try{
const r=await fetch("/api/mpesa/stkpush",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({phone,amount:total,name})
});
const d=await r.json();
if(d.success){
st.style.background="#d4edda";
st.innerText="✅ STK SENT! Enter PIN on phone to pay KES "+total;
btn.innerText="✅ Check Your Phone";
cart=[];draw();
setTimeout(()=>{btn.disabled=false;btn.innerText="Pay Now via M-Pesa";},12000);
}else{
st.style.background="#f8d7da";
st.innerText="❌ Failed: "+(d.error?.errorMessage||JSON.stringify(d.error).slice(0,150));
btn.disabled=false;
btn.innerText="Pay Now via M-Pesa";
}
}catch(e){
st.style.background="#f8d7da";
st.innerText="❌ Error: "+e.message;
btn.disabled=false;
btn.innerText="Pay Now via M-Pesa";
}
}
</script>
</body>
</html>
